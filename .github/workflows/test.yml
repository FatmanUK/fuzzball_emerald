name: Test

on:
  push:
    branches:
      - vmother

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.5'

    - name: Install dependencies
      run: go mod download

    # The 70-column rule is enforced on what a push adds, not on the whole
    # tree: about 2,900 existing lines are still long, nearly all string
    # literals whose splitting would cost more than it saves. See CLAUDE.md.
    #
    # github.event.before is all zeros on a branch's first push and after a
    # force-push, and a range from that resolves to nothing -- so the step
    # is skipped there rather than failing on a range git cannot walk.
    - name: Check line width of new code
      if: >-
        github.event.before != '0000000000000000000000000000000000000000'
      run: make width-check RANGE=${{ github.event.before }}..${{ github.sha }}
      continue-on-error: true

    # make check is vet, fmt-check and test. go vet had never run in CI:
    # this step was "make test" and the formatting check above it, so the
    # one thing neither covers was the one thing missing.
    - name: Vet, check formatting, and test
      run: make check
