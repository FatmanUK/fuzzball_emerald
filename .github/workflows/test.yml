name: Test

on:
  push:
    branches:
      - vmother

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.5'

    - name: Install dependencies
      run: go mod download

    - name: Check formatting
      run: make fmt-check

    # The 70-column rule is enforced on what a push adds, not on the whole
    # tree: about 2,900 existing lines are still long, nearly all string
    # literals whose splitting would cost more than it saves. See CLAUDE.md.
    - name: Check line width of new code
      run: make width-check RANGE=${{ github.event.before }}..${{ github.sha }}
      continue-on-error: true

    - name: Run unit tests
      run: make test
